version: "3.9"
services:
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  backend:
    build: ../../backend
    ports: ["8080:8080"]
    environment:
      REDIS_URL: redis://redis:6379/0
      ALLOWED_ORIGINS: http://localhost:5173
    depends_on: [redis]

  frontend:
    build: ../../frontend
    ports: ["5173:80"]
    depends_on: [backend]
